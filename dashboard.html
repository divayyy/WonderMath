<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard | WonderMath</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

    <style>
        * { font-family: 'Segoe UI', sans-serif; }

        body {
            margin: 0;
            background: 
                linear-gradient(rgba(10, 15, 30, 0.35), rgba(10, 15, 30, 0.45)), 
                url('assets/images/background1.png') center/cover no-repeat fixed;
            color: white;
            height: 100vh;
            overflow: hidden; /* Pas satu layar penuh tanpa scroll */
            display: flex;
            flex-direction: column;
        }

        /* NAVBAR ATAS DENGAN GARIS PEMBATAS */
        .navbar {
            padding: 15px 60px; 
            background: rgba(10, 15, 30, 0.4); 
            border-bottom: 1px solid rgba(255, 255, 255, 0.15); 
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.2); 
        }

        .brand-area {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .logo-nav {
            width: 40px; 
            height: auto;
        }

        .brand-text {
            font-size: 1.25rem;
            font-weight: 800;
            letter-spacing: 0.5px;
            color: #ffffff;
        }

        /* DROPDOWN PROFIL (KANAN ATAS) */
        .user-profile {
            width: 45px;
            height: 45px;
            background: rgba(255, 255, 255, 0.15);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            border: 1px solid rgba(255, 255, 255, 0.25);
            color: white;
            transition: 0.3s;
        }

        .user-profile:hover {
            background: rgba(255, 255, 255, 0.3);
            border-color: rgba(255, 255, 255, 0.5);
        }

        .dropdown-toggle::after {
            display: none;
        }

        .dropdown-menu {
            background: #162447; 
            border-radius: 12px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
            padding: 0;
            min-width: 180px;
            margin-top: 10px !important;
        }

        .dropdown-item {
            padding: 12px 20px;
            font-size: 14px;
            color: #cbd5e1;
        }

        .dropdown-item:hover {
            background: rgba(255, 255, 255, 0.08);
            color: white;
        }

        .dropdown-item.greeting {
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            cursor: default;
            font-weight: 600;
        }

        .dropdown-item.greeting:hover {
            background: transparent;
            color: #cbd5e1;
        }

        .dropdown-item.logout {
            color: #ff4d4d;
            font-weight: 600;
        }

        .dropdown-item.logout:hover {
            background: rgba(255, 77, 77, 0.1);
            color: #ff4d4d;
        }

        /* HERO CONTENT (CENTERED) */
        .hero-section {
            padding: 10px 60px;
            text-align: center;
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: center; 
            align-items: center;
        }

        /* LOGO UTAMA DI TENGAH */
        .center-logo {
            width: 150px; 
            height: auto;
            margin-bottom: 15px;
            filter: drop-shadow(0 0 15px rgba(255, 255, 255, 0.35)); 
        }

        /* TULISAN SAPAAN NAMA SISWA */
        .hello-tag {
            font-size: 1.5rem;
            font-weight: 700;
            color: #ffffff;
            margin-bottom: 5px;
            letter-spacing: 0.5px;
        }

        .hello-tag span {
            color: #FFB800; 
        }

        h1 {
            font-size: 3rem;
            font-weight: 900;
            margin-bottom: 25px; /* Jarak aman seimbang menuju card menu */
            letter-spacing: -1px;
        }

        /* CARDS MENU (UKURAN DIPERKECIL AGAR LEBIH LONGGAR) */
        .card-container {
            display: flex;
            gap: 20px;
            justify-content: center;
            flex-wrap: wrap;
            margin-bottom: 25px; /* Dikurangi agar tidak mendorong elemen bawah terlalu kuat */
        }

        .card-link {
            text-decoration: none;
            color: inherit;
        }

        .edu-card {
            background: rgba(15, 23, 42, 0.45); 
            border: 1px solid rgba(255, 255, 255, 0.15); 
            border-radius: 20px;
            padding: 25px 20px; /* Diperkecil dari sebelumnya */
            width: 240px; /* Diperkecil dari 280px */
            text-align: center;
            transition: all 0.4s cubic-bezier(0.165, 0.84, 0.44, 1);
            cursor: pointer;
        }

        .edu-card:hover {
            background: rgba(255, 255, 255, 0.1); 
            transform: translateY(-6px);
            border-color: #FFB800; 
            box-shadow: 0 10px 20px rgba(0, 0, 0, 0.4), 0 0 12px rgba(255, 184, 0, 0.2);
        }

        .icon-box {
            width: 55px; /* Diperkecil dari 65px */
            height: 55px; /* Diperkecil dari 65px */
            border-radius: 16px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 24px;
            margin: 0 auto 15px auto;
        }

        .blue-icon { background: #00bfff; color: white; box-shadow: 0 5px 15px rgba(0, 191, 255, 0.4); }

        .edu-card h3 { font-size: 1.4rem; font-weight: 800; margin-bottom: 8px; color: white; }
        .edu-card p { font-size: 0.9rem; color: rgba(255, 255, 255, 0.75); margin: 0; }

        /* TOMBOL TUTORIAL BAWAH */
        .tutor-grid {
            display: flex;
            justify-content: center;
            margin-top: 5px;
        }

        .tutor-btn {
            background: transparent; 
            border: 2px solid rgba(255, 184, 0, 0.6); 
            color: #FFB800;
            padding: 10px 24px;
            border-radius: 30px;
            text-decoration: none;
            font-weight: 700;
            font-size: 0.9rem;
            letter-spacing: 0.5px;
            transition: all 0.4s cubic-bezier(0.25, 1, 0.5, 1);
            display: flex;
            align-items: center;
            gap: 8px;
            white-space: nowrap;
        }

        .tutor-btn:hover {
            background: #FFB800;
            color: #0c1020;
            border-color: #FFB800;
            transform: scale(1.05);
            box-shadow: 0 0 20px rgba(255, 184, 0, 0.6);
            text-decoration: none;
        }

        /* RESPONSIVE */
        @media (max-width: 768px) {
            body { overflow-y: auto; height: auto; } 
            .navbar { padding: 15px 20px; }
            .hero-section { padding: 20px; }
            .center-logo { width: 110px; } 
            h1 { font-size: 2.2rem; margin-bottom: 20px; }
            .hello-tag { font-size: 1.3rem; }
            .card-container { flex-direction: column; align-items: center; gap: 15px; }
            .edu-card { width: 100%; max-width: 260px; padding: 25px; }
            .tutor-grid { width: 100%; justify-content: center; }
            .tutor-btn { width: 100%; max-width: 260px; justify-content: center; }
        }
        
    </style>
</head>
<body>

    <nav class="navbar">
        <div class="container-fluid p-0 d-flex justify-content-between align-items-center">
            <div class="brand-area">
                <img src="assets/images/logogeo.png" alt="Logo WonderMath" class="logo-nav">
                <span class="brand-text">WonderMath</span>
            </div>

            <div class="dropdown">
                <button class="user-profile dropdown-toggle" type="button" data-bs-toggle="dropdown" aria-expanded="false">
                    <i class="fa-solid fa-user"></i>
                </button>
                <ul class="dropdown-menu dropdown-menu-end">
                    <li><span class="dropdown-item greeting" id="popName">Haloo, Student</span></li>
                    <li><a class="dropdown-item logout" href="#" id="logoutBtn">Logout</a></li>
                </ul>
            </div>
        </div>
    </nav>

    <main class="hero-section">
        <img src="assets/images/logogeo.png" alt="Logo Utama WonderMath" class="center-logo">
        
        <div class="hello-tag">Halo, <span id="studentName">Student</span>!</div>
        
        <h1>WELCOME TO WonderMath</h1>

        <div class="card-container">
            <a href="baloklp.html" class="card-link">
                <div class="card edu-card">
                    <div class="icon-box blue-icon"><i class="fa-solid fa-cube"></i></div>
                    <h3>Balok</h3>
                    <p>Rusuk • Volume • Jaring</p>
                </div>
            </a>

            <a href="tabuunglp.html" class="card-link">
                <div class="card edu-card">
                    <div class="icon-box" style="background:#f51f0b; color:white; box-shadow:0 5px 15px rgba(245,158,11,0.4);">
                        <i class="fa-solid fa-database"></i>
                    </div>
                    <h3>Tabung</h3>
                    <p>Volume • Luas • Jaring Tabung</p>
                </div>
            </a>
        </div>

        <div class="tutor-grid">
            <a href="tutor-pakailp.html" class="tutor-btn">
                <i class="fas fa-circle-info"></i>
                Tutorial Penggunaan Media
            </a>
        </div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    
    <script>
        document.addEventListener('DOMContentLoaded', function() {
            const activeUser = localStorage.getItem('userName');
            
            if (activeUser && activeUser.trim() !== "") {
                document.getElementById('studentName').innerText = activeUser;
                document.getElementById('popName').innerText = 'Haloo, ' + activeUser;
            } else {
                window.location.replace('index.html'); 
            }
        });

        document.getElementById('logoutBtn').addEventListener('click', function(e) {
            e.preventDefault();
            localStorage.clear(); 
            window.location.replace('index.html'); 
        });
    </script>
<footer style="
    position: absolute; 
    bottom: 0; 
    width: 100%; 
    text-align: center; 
    color: rgba(255, 255, 255, 0.7); 
    font-size: 0.8rem; 
    letter-spacing: 0.5px;
    padding: 15px 0;
    background: rgba(10, 15, 30, 0.5); /* Background gelap transparan */
    backdrop-filter: blur(5px);         /* Efek kaca buram (glassmorphism) */
    border-top: 1px solid rgba(255, 255, 255, 0.1);
">
    Developed by <strong>DEVI</strong> & <strong>NURBAITY</strong> | <strong>UNIVERSITAS NEGERI MAKASSAR</strong>
</footer>
</body>
</html>
