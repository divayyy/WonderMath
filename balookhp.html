<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BALOK | WonderMath</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

    <style>
        * { font-family: 'Segoe UI', sans-serif; }

        body {
            margin: 0;
            background: 
                linear-gradient(rgba(10, 15, 30, 0.5), rgba(10, 15, 30, 0.6)), 
                url('assets/images/background1.png') center/cover no-repeat fixed;
            color: white;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        /* NAVBAR ATAS */
        .navbar {
            padding: 12px 20px;
            background: rgba(10, 15, 30, 0.4); 
            border-bottom: 1px solid rgba(255, 255, 255, 0.15); 
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.2); 
        }

        .brand-area {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .logo-img {
            width: 38px; 
            height: auto;
        }

        .brand-text {
            font-size: 1.15rem;
            font-weight: 800;
            letter-spacing: 0.5px;
            color: #ffffff;
        }

        /* MAIN LAYOUT FOR MOBILE */
        .content-section {
            padding: 20px;
            flex-grow: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        /* BUTTONS MENU VERTIKAL (PAS DI JEMPOL HP) */
        .btn-container {
            display: flex;
            flex-direction: column;
            gap: 12px;
            width: 100%;
            max-width: 440px;
            margin-bottom: 25px;
        }

        .menu-link {
            text-decoration: none;
            color: inherit;
        }

        .action-card {
            background: rgba(15, 23, 42, 0.6);
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 16px;
            padding: 16px 20px;
            display: flex;
            align-items: center;
            gap: 15px;
            transition: all 0.3s ease;
        }

        .action-card:hover {
            background: rgba(255, 255, 255, 0.08);
            border-color: #FFB800;
            transform: translateY(-2px);
        }

        .icon-circle {
            width: 45px;
            height: 45px;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 18px;
            flex-shrink: 0;
        }

        /* Variasi Warna Ikon Modul */
        .blue-icon { background: #00bfff; color: white; box-shadow: 0 4px 10px rgba(0, 191, 255, 0.3); }
        .teal-icon { background: #00fa9a; color: #0f172a; box-shadow: 0 4px 10px rgba(0, 250, 154, 0.3); font-weight: bold; }
        .orange-icon { background: #f59e0b; color: white; box-shadow: 0 4px 10px rgba(245, 158, 11, 0.3); }

        .text-info-card h3 {
            font-size: 1.1rem;
            font-weight: 700;
            margin: 0 0 2px 0;
            color: white;
        }

        .text-info-card p {
            font-size: 0.78rem;
            color: rgba(255, 255, 255, 0.6);
            margin: 0;
            line-height: 1.3;
        }

        /* BUTTON NAVIGASI KEMBALI */
        .back-nav-box {
            width: 100%;
            max-width: 440px;
            padding: 0 5px;
        }

        .btn-back-dash {
            background: transparent;
            border: 1px dashed rgba(255, 255, 255, 0.3);
            color: rgba(255, 255, 255, 0.8);
            padding: 12px;
            border-radius: 30px;
            text-decoration: none;
            font-weight: 600;
            font-size: 0.85rem;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            width: 100%;
        }

        .btn-back-dash:hover {
            border-style: solid;
            border-color: #ffffff;
            color: #ffffff;
            background: rgba(255, 255, 255, 0.05);
            text-decoration: none;
        }
    </style>
</head>
<body>

    <nav class="navbar">
        <div class="container-fluid p-0">
            <div class="brand-area">
                <img src="assets/images/logogeo.png" alt="Logo WonderMath" class="logo-img">
                <span class="brand-text">WonderMath</span>
            </div>
        </div>
    </nav>

    <main class="content-section">
        
        <!-- Tombol Menu Langsung Ditampilkan -->
        <div class="btn-container">
            
            <a href="balokhp.html" class="menu-link">
                <div class="card action-card">
                    <div class="icon-circle blue-icon">
                        <i class="fa-solid fa-shapes"></i>
                    </div>
                    <div class="text-info-card">
                        <h3>Eksplorasi 3D & Materi</h3>
                        <p>Pelajari sisi, rusuk, titik sudut, dan jaring-jaring balok interaktif.</p>
                    </div>
                </div>
            </a>

            <a href="latihanbalokhp.html" class="menu-link">
                <div class="card action-card">
                    <div class="icon-circle teal-icon">
                        <i class="fa-solid fa-lightbulb"></i>
                    </div>
                    <div class="text-info-card">
                        <h3>Latihan Mandiri</h3>
                        <p>Asah kemampuan pemecahan masalah dibimbing petunjuk pintar AI.</p>
                    </div>
                </div>
            </a>

            <a href="kuisbalokhp.html" class="menu-link">
                <div class="card action-card">
                    <div class="icon-circle orange-icon">
                        <i class="fa-solid fa-stopwatch"></i>
                    </div>
                    <div class="text-info-card">
                        <h3>Kuis Evaluasi</h3>
                        <p>Uji pemahaman akhirmu secara mandiri. Nilai langsung keluar!</p>
                    </div>
                </div>
            </a>

        </div>

        <div class="back-nav-box">
            <a href="dashboardhp.html" class="btn-back-dash">
                <i class="fa-solid fa-house"></i> Kembali ke Dashboard Utama
            </a>
        </div>

    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
